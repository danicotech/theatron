<!doctype html>
<meta charset="utf-8">
<title>kuwahara bake</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
/* 離線烘焙用。shader 直接抄 stylized-components/src/components/kuwahara/glsl/，
   一行都不改；差別只在這裡沒有 three / postprocessing，是裸 WebGL2 兩趟 FBO。
   底圖是靜態的，同一張圖每一幀算出來都一樣，所以沒有理由放到執行期算。 */

const VERT = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

const TENSOR = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 fragColor;
uniform sampler2D uInput;
uniform vec2 uResolution;
const mat3 Gx = mat3(-1,-2,-1, 0,0,0, 1,2,1);
const mat3 Gy = mat3(-1, 0, 1,-2,0,2,-1,0,1);
vec4 computeStructureTensor(sampler2D tex, vec2 uv){
  vec2 texel = 1.0/uResolution;
  vec3 a=texture(tex,uv+vec2(-1,-1)*texel).rgb, b=texture(tex,uv+vec2(-1,0)*texel).rgb, c=texture(tex,uv+vec2(-1,1)*texel).rgb;
  vec3 d=texture(tex,uv+vec2( 0,-1)*texel).rgb, e=texture(tex,uv+vec2( 0,0)*texel).rgb, f=texture(tex,uv+vec2( 0,1)*texel).rgb;
  vec3 g=texture(tex,uv+vec2( 1,-1)*texel).rgb, h=texture(tex,uv+vec2( 1,0)*texel).rgb, i=texture(tex,uv+vec2( 1,1)*texel).rgb;
  vec3 Sx = Gx[0][0]*a + Gx[1][0]*d + Gx[2][0]*g + Gx[0][1]*b + Gx[1][1]*e + Gx[2][1]*h + Gx[0][2]*c + Gx[1][2]*f + Gx[2][2]*i;
  vec3 Sy = Gy[0][0]*a + Gy[1][0]*d + Gy[2][0]*g + Gy[0][1]*b + Gy[1][1]*e + Gy[2][1]*h + Gy[0][2]*c + Gy[1][2]*f + Gy[2][2]*i;
  return vec4(dot(Sx,Sx), dot(Sy,Sy), dot(Sx,Sy), 1.0);
}
void main(){ fragColor = computeStructureTensor(uInput, vUv); }`;

const KUWA = `#version 300 es
precision highp float;
#define SECTOR_COUNT 8
const int MAX_RADIUS = 16;
const int ANGLE_STEPS = 5;
const float ANGLE_START = -0.392699;
const float ANGLE_STEP  =  0.196349;
in vec2 vUv; out vec4 fragColor;
uniform sampler2D uTensor, uColor;
uniform vec2 uResolution;
uniform float uRadius, uAlpha, uEta, uLambda;
/* 只有烘焙器多的一顆：0 = 全幅上漆。>0 時把 vUv.x 左邊留原圖，用來出對照圖。 */
uniform float uSplit;

vec3 sampleColor(vec2 off){ return texture(uColor,(gl_FragCoord.xy+off)/uResolution).rgb; }

vec4 getDominantOrientation(vec4 t){
  float Jxx=t.r, Jyy=t.g, Jxy=t.b;
  float tr=Jxx+Jyy, det=Jxx*Jyy-Jxy*Jxy;
  float l1 = tr*0.5 + sqrt(max(tr*tr*0.25-det,0.0));
  float l2 = tr*0.5 - sqrt(max(tr*tr*0.25-det,0.0));
  float s  = abs(Jxy)/(abs(Jxx)+abs(Jyy)+abs(Jxy)+1e-6);
  vec2 v = s>0.0 ? normalize(vec2(-Jxy, Jxx-l1)) : vec2(0.0,1.0);
  return vec4(normalize(v), l1, l2);
}
float polynomialWeight(float x,float y,float eta,float lambda){
  float p = (x+eta) - lambda*(y*y); return max(0.0,p*p);
}
void sector(mat2 M,float angle,float radius,out vec3 avgColor,out float variance){
  vec3 sum=vec3(0.0), sq=vec3(0.0); float tw=0.0;
  for(int ri=1; ri<=MAX_RADIUS; ri++){
    float r=float(ri); if(r>radius) break;
    for(int ai=0; ai<ANGLE_STEPS; ai++){
      float a = ANGLE_START + float(ai)*ANGLE_STEP;
      vec2 off = M * (r*vec2(cos(angle+a), sin(angle+a)));
      vec3 col = sampleColor(off);
      float w = polynomialWeight(off.x, off.y, uEta, uLambda);
      sum += col*w; sq += col*col*w; tw += w;
    }
  }
  float sw = max(tw,1e-6);
  avgColor = sum/sw;
  vec3 vr = (sq/sw) - avgColor*avgColor;
  variance = dot(vr, vec3(0.299,0.587,0.114));
}
void main(){
  vec4 st = texture(uTensor, vUv);
  vec4 oa = getDominantOrientation(st);
  vec2 o  = oa.xy;
  float aniso = (oa.z-oa.w)/(oa.z+oa.w+1e-6);
  float alpha = max(uAlpha,1e-3);
  float sx = alpha/(aniso+alpha), sy = (aniso+alpha)/alpha;
  mat2 rot = mat2(o.x,o.y,-o.y,o.x);
  mat2 M = rot * mat2(sx,0.0,0.0,sy);
  vec3 avg[SECTOR_COUNT]; float var[SECTOR_COUNT];
  for(int i=0;i<SECTOR_COUNT;i++){
    sector(M, float(i)*6.28318/float(SECTOR_COUNT), uRadius, avg[i], var[i]);
  }
  float mv=var[0]; vec3 col=avg[0];
  for(int i=1;i<SECTOR_COUNT;i++){ if(var[i]<mv){ mv=var[i]; col=avg[i]; } }
  if(uSplit>0.0 && vUv.x<uSplit){
    col = texture(uColor,vUv).rgb;
    if(vUv.x > uSplit - 1.5/uResolution.x) col = vec3(1.0);
  }
  fragColor = vec4(col,1.0);
}`;

function sh(gl,type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(gl,fs){
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl,gl.VERTEX_SHADER,VERT));
  gl.attachShader(p,sh(gl,gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'aPos'); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

window.bake = async function(opt){
  const {src, radius=3, alpha=2, eta=0.36, lambda=0.85, split=0, scale=1} = opt;
  const img = new Image();
  img.decoding='sync';
  await new Promise((ok,no)=>{ img.onload=ok; img.onerror=()=>no(new Error('load '+src)); img.src=src; });

  const W = Math.round(img.naturalWidth*scale), H = Math.round(img.naturalHeight*scale);
  const cv = document.getElementById('c'); cv.width=W; cv.height=H;
  const gl = cv.getContext('webgl2',{preserveDrawingBuffer:true, antialias:false, premultipliedAlpha:false});
  if(!gl) throw new Error('no webgl2');
  /* 張量存的是梯度平方和，會遠超過 1.0，用 8 bit 會夾成一片平的方向場 */
  if(!gl.getExtension('EXT_color_buffer_float')) throw new Error('no float render target');

  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

  const srcTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,srcTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,img);
  for(const k of ['TEXTURE_MIN_FILTER','TEXTURE_MAG_FILTER']) gl.texParameteri(gl.TEXTURE_2D,gl[k],gl.LINEAR);
  for(const k of ['TEXTURE_WRAP_S','TEXTURE_WRAP_T']) gl.texParameteri(gl.TEXTURE_2D,gl[k],gl.CLAMP_TO_EDGE);

  const tTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,W,H,0,gl.RGBA,gl.HALF_FLOAT,null);
  for(const k of ['TEXTURE_MIN_FILTER','TEXTURE_MAG_FILTER']) gl.texParameteri(gl.TEXTURE_2D,gl[k],gl.NEAREST);
  for(const k of ['TEXTURE_WRAP_S','TEXTURE_WRAP_T']) gl.texParameteri(gl.TEXTURE_2D,gl[k],gl.CLAMP_TO_EDGE);
  const fbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tTex,0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) throw new Error('fbo incomplete');

  gl.viewport(0,0,W,H);

  // 第一趟：結構張量
  const pT=prog(gl,TENSOR); gl.useProgram(pT);
  gl.uniform2f(gl.getUniformLocation(pT,'uResolution'),W,H);
  gl.uniform1i(gl.getUniformLocation(pT,'uInput'),0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,srcTex);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // 第二趟：上漆
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const pK=prog(gl,KUWA); gl.useProgram(pK);
  gl.uniform2f(gl.getUniformLocation(pK,'uResolution'),W,H);
  gl.uniform1f(gl.getUniformLocation(pK,'uRadius'),radius);
  gl.uniform1f(gl.getUniformLocation(pK,'uAlpha'),alpha);
  gl.uniform1f(gl.getUniformLocation(pK,'uEta'),eta);
  gl.uniform1f(gl.getUniformLocation(pK,'uLambda'),lambda);
  gl.uniform1f(gl.getUniformLocation(pK,'uSplit'),split);
  gl.uniform1i(gl.getUniformLocation(pK,'uTensor'),0);
  gl.uniform1i(gl.getUniformLocation(pK,'uColor'),1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,srcTex);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.finish();

  return cv.toDataURL('image/png');
};
</script>
