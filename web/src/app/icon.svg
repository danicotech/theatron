<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="論劍">
  <!-- 分頁小圖示。16px 下要認得出來，所以不畫「論劍」兩個字 ——
       中文字在那個尺寸會糊成一團，而且 SVG 圖示不保證有中文字型。
       畫一把直立的劍：一條豎線加一道橫檔，縮到 16px 仍然是「劍」的剪影。

       第一版太細也太小：劍身 3.1/32 在 16px 下只剩 1.5 個實體像素，
       而且劍首那顆球跟護手黏成一塊。現在劍身加粗到 4.4、整把撐滿畫面，
       劍首拿掉 —— 沒有它照樣是一把劍，有它在 16px 只是一坨。
       金 #c9a227 與底 #080d13 是站上的品牌色，跟頁首同一組。 -->
  <rect width="32" height="32" rx="6" fill="#080d13"/>
  <g fill="#c9a227">
    <!-- 劍身，帶尖 -->
    <path d="M16 2.6 18.2 7.4V19.4H13.8V7.4Z"/>
    <!-- 護手 -->
    <rect x="5.6" y="19.4" width="20.8" height="3.4" rx="1.7"/>
    <!-- 劍柄 -->
    <rect x="13.9" y="22.8" width="4.2" height="6.6" rx="1.4"/>
  </g>
</svg>
