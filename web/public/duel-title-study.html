<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>比武題字 · 四式試樣</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b141c;color:#eee7d5;font-family:system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #34414a;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font:600 22px/1.3 Georgia,serif;margin:0}header p{margin:6px 0 0;color:#b9c0c3;font-size:13px}main{display:grid;grid-template-columns:260px 1fr;height:calc(100svh - 94px)}aside{padding:20px;overflow:auto;border-right:1px solid #34414a}button{cursor:pointer;color:inherit;font:inherit}button:focus-visible{outline:2px solid #ecd39c;outline-offset:3px}.choice{display:block;width:100%;text-align:left;border:1px solid #44505a;background:transparent;padding:16px;margin:0 0 12px}.choice[aria-pressed=true]{border-color:#c39d62;background:#20262a}.choice strong{display:block;font:600 19px/1.6 Georgia,serif}.choice span{display:block;color:#b9c0c3;font-size:13px;line-height:1.7;margin-top:5px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.controls button,#replay{background:#8f382c;border:1px solid #bf7062;padding:10px 16px;min-height:44px}#note{font-size:13px;line-height:1.8;color:#c8c0b1}section{min-width:0;display:flex;justify-content:center;background:#03080c;overflow:hidden}iframe{border:0;width:100%;height:100%;transition:width .2s}section.mobile iframe{width:390px}#status{font-size:12px;color:#d9b77d} @media(max-width:760px){header{padding:12px}h1{font-size:19px}main{display:flex;flex-direction:column;height:auto}aside{padding:12px;border:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{margin:0;padding:10px}.choice strong{font-size:16px}.choice span{font-size:12px}.controls{margin-top:12px}section{height:760px}header p{max-width:220px}}
</style>
<header><div><h1>比武題字 · 四式試樣</h1><p>在原比武場景中比較題字、章印與落印節奏。</p></div><button id="replay">重播題字與落印</button></header>
<main><aside><div class="choices">
<button class="choice" data-style="a" aria-pressed="false"><strong>A · 朱印金書</strong><span>金色大字，放大朱白方印，傾斜落款。最接近目前方向。</span></button>
<button class="choice" data-style="b" aria-pressed="false"><strong>B · 月白朱文</strong><span>月白題字，紙色底配朱紅印文，墨邊雙框。</span></button>
<button class="choice" data-style="c" aria-pressed="true"><strong>C · 長印橫題</strong><span>舒展橫向金字，窄長朱印，下緣錯位呈現。</span></button>
<button class="choice" data-style="d" aria-pressed="false"><strong>D · 金線題額</strong><span>薄金線框住題字，朱印搭在左上，像殿前題額。</span></button>
</div><div class="controls"><button id="desktop">寬版</button><button id="mobile">手機</button></div><p id="note">選擇方案即可試看。正式頁面不會隨這裡的選擇改動。</p><p id="status" role="status">正在準備場景…</p></aside><section id="stage"><iframe id="preview" title="比武標題設計預覽" src="/?intro=0#duel"></iframe></section></main>
<script>
const frame=document.getElementById('preview'), status=document.getElementById('status');let selected='c',ready=false;
const css=`
#duel .duel-calligraphy{top:calc(var(--nav-h) + 24px);padding:10px 22px;text-align:center}
#duel .chapter-calligraphy{font-size:clamp(66px,7vw,94px);color:#e4c989}
#duel [data-chapter-seal]::after{left:auto;right:calc(100% + 12px);width:58px;height:62px;font-size:38px;--seal-angle:-12deg;transform:translateY(-50%) rotate(var(--seal-angle));border:2px solid #973e32;outline:1px solid #973e32;outline-offset:3px;background:#973e32;color:#f3e7cc}
#duel [data-title-state=complete]::after{animation:demo-land 480ms cubic-bezier(.2,.7,.2,1) both}
@keyframes demo-land{from{opacity:0;transform:translateY(-65%) rotate(calc(var(--seal-angle) - 4deg)) scale(1.4)}70%{opacity:1;transform:translateY(-50%) rotate(var(--seal-angle)) scale(.96)}to{opacity:1;transform:translateY(-50%) rotate(var(--seal-angle)) scale(1)}}
body[data-title-demo=b] #duel .chapter-calligraphy{color:#f0ebdf;font-size:clamp(66px,7vw,90px)}
body[data-title-demo=b] #duel [data-chapter-seal]::after{background:#e9e0ce;color:#963c30;border:3px double #963c30;--seal-angle:-9deg;outline-offset:2px}
body[data-title-demo=c] #duel .chapter-calligraphy{width:2.65em;color:#ddc18a}
body[data-title-demo=c] #duel [data-chapter-seal]::after{width:43px;height:76px;font-size:34px;right:calc(100% - 2px);top:calc(65% - 20px);--seal-angle:-8deg}
body[data-title-demo=d] #duel .duel-calligraphy{border:1px solid #aa8a56;background:rgba(7,15,22,.7);padding:4px 28px;box-shadow:inset 0 0 0 4px #111b23,inset 0 0 0 5px #76623f}
body[data-title-demo=d] #duel [data-chapter-seal]::after{right:calc(100% + 6px);top:25%;--seal-angle:-14deg}
@media(max-width:600px){#duel .chapter-calligraphy{font-size:62px!important}#duel [data-chapter-seal]::after{width:42px;height:48px;font-size:29px;right:calc(100% + 4px)}body[data-title-demo=c] #duel [data-chapter-seal]::after{width:34px;height:58px;font-size:27px;right:calc(100% - 10px)}body[data-title-demo=d] #duel .duel-calligraphy{padding-inline:16px}}
@media(prefers-reduced-motion:reduce){#duel [data-chapter-seal]::after{animation:none!important;opacity:1!important}}
`;
function replay(){if(!ready)return;const doc=frame.contentDocument,w=frame.contentWindow;doc.body.dataset.titleDemo=selected;const host=doc.querySelector('#duel [data-chapter-title]');if(w.matchMedia('(prefers-reduced-motion:reduce)').matches){host.textContent='比武';host.dataset.titleState='plain';return;}host.innerHTML=w.strokeSVG('比武',{track:.10,dur:2400,gap:24,charGap:160,lace:false});host.dataset.titleState='writing';const svg=host.querySelector('svg');svg.classList.add('writing');const last=host.querySelectorAll('.ink-nib');last[last.length-1].addEventListener('animationend',()=>{host.dataset.titleState='complete'},{once:true});status.textContent='目前預覽：'+selected.toUpperCase()+' · 題字完成後落印';}
frame.addEventListener('load',()=>{ready=false;const wait=setInterval(()=>{const w=frame.contentWindow;if(!w.strokeSVG||!w.strokeSVG('比武')||!frame.contentDocument.querySelector('#duel [data-chapter-title]'))return;clearInterval(wait);let sheet=frame.contentDocument.createElement('style');sheet.textContent=css;frame.contentDocument.head.append(sheet);ready=true;replay();},100);setTimeout(()=>{clearInterval(wait);if(!ready)status.textContent='場景尚未載入，請確認本機服務正在運行後重新整理。'},15000);});
document.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.style;document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));replay();}));document.getElementById('replay').onclick=replay;document.getElementById('desktop').onclick=()=>document.getElementById('stage').classList.remove('mobile');document.getElementById('mobile').onclick=()=>document.getElementById('stage').classList.add('mobile');
</script></html>
