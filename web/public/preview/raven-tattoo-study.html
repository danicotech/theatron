</style></head><body><header><span>夜鴨爭鋒 / 幾何刺青 / 配色不變</span><nav aria-label="設計方向"><a href="?design=A" data-option="A">A 切面</a><a href="?design=B" data-option="B">B 軸月</a><a href="?design=C" data-option="C">C 展翼</a></nav></header><main><canvas class="mark" aria-label="無填色的幾何烏鴉與月亮線稿" role="img"></canvas><h1>夜鴨爭鋒</h1><div class="subtitle">NIGHT RAVENS TOURNAMENT</div><div class="meter"><canvas class="bar" aria-hidden="true"></canvas><div class="caption"><span>動態選稿 · 模擬載入</span><strong id="percent">0%</strong></div></div></main><footer><span id="description"></span><button id="replay">重播線條動畫</button></footer>
<script>
const params=new URLSearchParams(location.search),choice=['A','B','C'].includes(params.get('design'))?params.get('design'):'A';
document.querySelector(`[data-option="${choice}"]`).setAttribute('aria-current','page');
const labels={A:'A / 切面 — 低首烏鴉 × 月牙切面 · 讀取條 A',B:'B / 軸月 — 疏線鳥首 × 幾何定位 · 讀取條 A',C:'C / 展翼 — 放射翼骨 × 三角構圖 · 讀取條 A'};
document.querySelector('#description').textContent=labels[choice];
const styles=getComputedStyle(document.documentElement),ink=styles.getPropertyValue('--ink').trim(),gold=styles.getPropertyValue('--gold').trim();
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),still=params.has('still');
const mark=document.querySelector('.mark'),bar=document.querySelector('.bar');
let start=performance.now(),raf=0;
function prepare(canvas){const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);return [ctx,box.width,box.height]}
let mc,mw,mh,bc,bw,bh;function resize(){[mc,mw,mh]=prepare(mark);[bc,bw,bh]=prepare(bar);render(performance.now())}
function line(ctx,points,p=1,color=ink,width=1.3,alpha=1){if(p<=0)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.globalAlpha=alpha;ctx.lineJoin='miter';ctx.lineCap='butt';let total=0;for(let i=1;i<points.length;i++)total+=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);let remain=total*Math.min(p,1);ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);if(remain>=len){ctx.lineTo(...b);remain-=len}else{ctx.lineTo(a[0]+(b[0]-a[0])*remain/len,a[1]+(b[1]-a[1])*remain/len);break}}ctx.stroke();ctx.restore()}
// Original tattoo-reference studies: triangulation follows anatomy, stroke only.
const outline=[[44,230],[58,156],[77,109],[105,79],[129,64],[158,61],[183,75],[195,96],[199,112],[235,153],[195,130],[181,127],[165,156],[150,199],[109,259],[113,213],[74,254],[82,214],[44,230]];
const wing=[[[77,109],[117,112],[58,156],[77,109]],[[58,156],[117,112],[44,230]],[[44,230],[103,178],[58,156]],[[103,178],[117,112],[137,142],[113,213],[103,178]],[[82,214],[103,178],[74,254]],[[113,213],[137,142],[150,199]],[[137,142],[165,156],[117,112]]];
const face=[[[105,79],[143,86],[129,64]],[[143,86],[158,61],[183,75],[143,86],[195,96]],[[117,112],[143,86],[153,119],[137,142]],[[153,119],[181,127],[165,156]],[[181,127],[195,96],[199,112],[235,153]],[[165,93],[181,101],[171,101],[165,93]]];
const moon=[[157,24],[201,37],[237,68],[260,111],[262,157],[244,200],[212,234],[176,251],[204,215],[223,170],[226,123],[214,81],[188,49],[157,24]];
const moonFacets=[[[201,37],[188,49],[237,68],[214,81],[260,111],[226,123],[262,157],[223,170],[244,200],[204,215],[212,234]]];
const flightOutline=[[72,152],[43,115],[20,66],[60,85],[33,38],[84,73],[57,22],[111,65],[141,124],[158,106],[177,99],[194,106],[202,119],[234,137],[200,136],[182,150],[164,171],[189,226],[169,214],[174,248],[144,211],[142,243],[123,197],[88,218],[58,242],[71,207],[35,220],[72,180],[72,152]];
const flightFacets=[[[20,66],[117,146],[43,115]],[[60,85],[117,146],[33,38]],[[84,73],[117,146],[57,22]],[[111,65],[117,146],[141,124]],[[72,152],[117,146],[72,180]],[[72,180],[117,146],[88,218]],[[71,207],[123,197],[58,242]],[[117,146],[158,106],[153,146],[123,197],[164,171],[153,146],[182,150],[200,136],[202,119],[153,146]],[[158,106],[194,106],[153,146]],[[181,118],[191,121]],[[123,197],[144,211],[164,171],[169,214]],[[164,171],[174,248]],[[117,146],[142,243]]];
function logo(t){mc.clearRect(0,0,mw,mh);mc.save();mc.scale(mw/300,mh/300);const p=still||reduced.matches?1:Math.min(1,t/1600);let paths=[];
 if(choice==='A'){line(mc,moon,p,gold,1);moonFacets.forEach(pts=>line(mc,pts,p,gold,.75,.72));paths=[outline,...wing,...face];}
 if(choice==='B'){
  line(mc,[[145,24],[27,247],[263,247],[145,24]],p,gold,.8,.6);
  line(mc,[[145,9],[145,48]],p,gold,1);line(mc,[[145,260],[145,285]],p,gold,1);
  line(mc,[[137,17],[145,9],[153,17]],p,gold,.8);
  const arc=[];for(let i=0;i<=24;i++){let angle=(-85+i*170/24)*Math.PI/180;arc.push([150+114*Math.cos(angle),145+114*Math.sin(angle)])}line(mc,arc,p,gold,1,.9);
  line(mc,[[259,126],[243,141],[260,160]],p,gold,.8);
  paths=[outline,wing[1],wing[3],wing[6],face[0],face[1],face[3],face[4],face[5]];
 }
 if(choice==='C'){
  line(mc,[[20,63],[270,63],[145,282],[20,63]],p,gold,.8,.6);
  line(mc,[[222,28],[246,42],[260,64],[266,91],[261,118],[245,141],[261,94],[250,62],[222,28]],p,gold,1.15);
  paths=[flightOutline,...flightFacets];
 }
 paths.forEach((pts,i)=>line(mc,pts,still||reduced.matches?1:Math.max(0,Math.min(1,(t-120-i*40)/1100)),ink,i===0?1.65:1,i===0?1:.83));mc.restore()}
function loading(t){bc.clearRect(0,0,bw,bh);bc.save();bc.scale(bw/570,bh/90);let p=still?.78:reduced.matches?1:Math.min(1,(t%12500)/10500);document.querySelector('#percent').textContent=String(Math.round(p*100)).padStart(2,'0')+'%';let axis=false?[[2,47],[176,47],[194,39],[363,39],[381,47],[568,47]]:false?[[2,54],[150,54],[300,49],[450,39],[568,28]]:[[2,45],[568,45]];line(bc,axis,1,ink,.65,.16);line(bc,axis,p,gold,1.2);let count=false?9:12;for(let i=0;i<count;i++){let x=35+i*(485/(count-1)),u=x/568,draw=Math.max(0,Math.min(1,(p-u+.09)/.13)),sway=still||reduced.matches?0:Math.sin(t/950-i*.42)*2;let pts;if(true){let h=10+16*Math.sin(u*Math.PI);pts=[[x,45],[x+26,45-h+sway],[x+47,45]];line(bc,pts,draw,ink,1,.85);line(bc,[[x,45],[x+24,45+h-sway],[x+47,45]],draw,ink,.85,.62)}else if(false){let y=54-26*u*u,h=14+19*Math.sin(u*Math.PI);line(bc,[[x,y],[x+17,y-h*.5+sway],[x+37,y-h]],draw,ink,1.15);line(bc,[[x+9,y],[x+26,y+11+sway],[x+45,y+16]],draw,ink,.85,.6)}else{let y=x<180||x>380?47:39;line(bc,[[x,y],[x+19,y-18+sway],[x+33,y-18+sway]],draw,ink,1);line(bc,[[x+10,y],[x+28,y+14-sway],[x+39,y+14-sway]],draw,ink,.85,.65)}}if(!still&&!reduced.matches){let q=(t%2300)/2300;line(bc,[[q*530,false?54-26*q*q:45],[q*530+18,false?53-26*q*q:45]],1,ink,1.7,Math.sin(q*Math.PI)*.7)}bc.restore()}
function render(now){let t=now-start;logo(t);loading(t)}function loop(now){render(now);raf=requestAnimationFrame(loop)}function resume(){cancelAnimationFrame(raf);if(!document.hidden&&!still&&!reduced.matches)raf=requestAnimationFrame(loop);else render(performance.now())}
new ResizeObserver(resize).observe(document.querySelector('main'));window.addEventListener('resize',resize);document.addEventListener('visibilitychange',resume);reduced.addEventListener('change',resume);document.querySelector('#replay').onclick=()=>{if(still){location.search='?design='+choice;return}start=performance.now();resume()};window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));resize();resume();
</script></body></html>
