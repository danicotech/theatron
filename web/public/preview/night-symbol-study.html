<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜鴨爭鋒 · 抽象元素選稿</title>
<style>
:root{--surface:#080d11;--ink:#e5ddcb;--gold:#bfa779;--muted:#92958f;--edge:#343b3e}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font-family:Georgia,"Noto Serif TC",serif}header{position:absolute;top:28px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;font:12px/1.6 sans-serif;letter-spacing:.14em;color:var(--muted)}nav{display:flex;gap:20px}a{color:inherit;text-decoration:none;padding:8px 4px}a[aria-current]{color:var(--ink);border-bottom:1px solid var(--gold)}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 24px 64px}.mark{width:290px;height:300px}h1{font-weight:400;font-size:32px;letter-spacing:.36em;text-indent:.36em;margin:24px 0 10px}.subtitle{color:var(--muted);font:10px/1.6 sans-serif;letter-spacing:.32em}.meter{width:min(570px,85vw);margin-top:48px}.bar{display:block;width:100%;height:90px}.caption{display:flex;justify-content:space-between;color:var(--muted);font:11px/1.7 monospace;letter-spacing:.12em}.caption strong{font-weight:400;color:var(--ink)}footer{position:absolute;bottom:28px;left:40px;right:40px;display:flex;justify-content:space-between;color:var(--muted);font:11px/1.6 sans-serif;letter-spacing:.08em}button{background:none;color:var(--ink);border:0;border-bottom:1px solid var(--edge);padding:4px 0;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}@media(max-width:600px){header{left:20px;right:20px;top:16px;align-items:flex-start}header>span{max-width:105px;font-size:10px}nav{gap:8px}.mark{width:250px;height:260px}h1{font-size:27px}.meter{margin-top:30px}footer{left:20px;right:20px;bottom:14px}footer span{max-width:250px}main{padding-top:100px;padding-bottom:80px}}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 100px;width:min(840px,94vw)}.compare-grid figure{margin:0;text-align:center}.compare-canvas{width:250px;height:260px}.compare-grid figcaption{font:13px/1.6 sans-serif;color:var(--ink);letter-spacing:.12em}.comparing main>.mark,.comparing main>h1,.comparing main>.subtitle,.comparing .meter{display:none}.comparing footer span{font-size:0}.comparing footer span::after{content:"四款共用已選定的 A 讀取條 · 無填色 Canvas 線稿";font-size:11px}@media(max-width:600px){.compare-grid{gap:28px 12px}.compare-canvas{width:155px;height:165px}.compare-grid figcaption{font-size:10px}}
</style></head><body><header><span>夜鴨爭鋒 / 抽象元素 / 配色不變</span><nav aria-label="設計方向"><a href="?design=A" data-option="A">A 月鋒</a><a href="?design=B" data-option="B">B 蝕環</a><a href="?design=C" data-option="C">C 山月</a><a href="?design=D" data-option="D">D 月印</a></nav></header><main><canvas class="mark" aria-label="無填色的月相與幾何元素線稿" role="img"></canvas><h1>夜鴨爭鋒</h1><div class="subtitle">NIGHT RAVENS TOURNAMENT</div><div class="meter"><canvas class="bar" aria-hidden="true"></canvas><div class="caption"><span>動態選稿 · 模擬載入</span><strong id="percent">0%</strong></div></div></main><footer><span id="description"></span><button id="replay">重播線條動畫</button></footer>
<script>
const params=new URLSearchParams(location.search),choice=['A','B','C','D'].includes(params.get('design'))?params.get('design'):'A';
document.querySelector(`[data-option="${choice}"]`).setAttribute('aria-current','page');
const labels={A:'A / 月鋒 — 月相 × 劍鋒 · 讀取條 A',B:'B / 蝕環 — 蝕月 × 平衡軸線 · 讀取條 A',C:'C / 山月 — 山脊 × 弦月 · 讀取條 A',D:'D / 月印 — 回紋 × 月輪 · 讀取條 A'};
document.querySelector('#description').textContent=labels[choice];
const styles=getComputedStyle(document.documentElement),ink=styles.getPropertyValue('--ink').trim(),gold=styles.getPropertyValue('--gold').trim();
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),still=params.has('still');
const mark=document.querySelector('.mark'),bar=document.querySelector('.bar');
let start=performance.now(),raf=0;
function prepare(canvas){const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);return [ctx,box.width,box.height]}
let mc,mw,mh,bc,bw,bh;function resize(){[mc,mw,mh]=prepare(mark);[bc,bw,bh]=prepare(bar);render(performance.now())}
function line(ctx,points,p=1,color=ink,width=1.3,alpha=1){if(p<=0)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.globalAlpha=alpha;ctx.lineJoin='miter';ctx.lineCap='butt';let total=0;for(let i=1;i<points.length;i++)total+=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);let remain=total*Math.min(p,1);ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);if(remain>=len){ctx.lineTo(...b);remain-=len}else{ctx.lineTo(a[0]+(b[0]-a[0])*remain/len,a[1]+(b[1]-a[1])*remain/len);break}}ctx.stroke();ctx.restore()}
// Abstract identities: hand-defined geometry, Canvas strokes only.
function arc(x,y,r,a,b,n=72){return Array.from({length:n+1},(_,i)=>{let t=(a+(b-a)*i/n)*Math.PI/180;return[x+r*Math.cos(t),y+r*Math.sin(t)]})}
function logo(t,variant=choice,target=mc,w=mw,h=mh){const mc=target,mw=w,mh=h;mc.clearRect(0,0,mw,mh);mc.save();mc.scale(mw/300,mh/300);const paths=[];
 const add=(pts,color=ink,width=1.2,alpha=1)=>paths.push({pts,color,width,alpha});
 if(variant==='A'){
  add(arc(150,145,86,-72,72),gold,1.2);add(arc(150,145,86,108,252),gold,1.2);
  add([[150,29],[159,57],[155,195],[150,258],[145,195],[141,57],[150,29]],ink,1.5);
  add([[150,50],[150,220]],ink,.65,.65);
  add([[121,181],[137,188],[163,188],[179,181]],gold,1.3);
  add([[136,30],[141,23],[159,23],[164,30]],ink,1);
  add([[63,145],[78,145]],ink,.8);add([[222,145],[237,145]],ink,.8);
 }else if(variant==='B'){
  add(arc(150,145,93,35,325),ink,1.5);
  add(arc(150,145,82,-132,132),gold,1.1);
  add(arc(186,145,80,112,248),ink,1.1);
  add([[150,28],[150,59]],gold,.8);add([[150,231],[150,262]],gold,.8);
  add([[40,145],[69,145]],gold,.8);add([[229,145],[260,145]],gold,.8);
  add([[150,17],[155,23],[150,29],[145,23],[150,17]],ink,.9);
  add([[150,264],[155,270],[150,276],[145,270],[150,264]],ink,.9);
 }else if(variant==='C'){
  add([[41,211],[107,129],[137,160],[181,92],[259,211]],ink,1.6);
  add([[107,129],[120,183],[137,160]],ink,.85,.8);
  add([[181,92],[177,157],[192,171],[204,160],[259,211]],gold,1);
  add([[60,222],[240,222]],gold,.8,.7);
  add(arc(132,95,53,148,312),gold,1.2);
  add(arc(145,82,48,155,264),gold,.75);
  add([[143,204],[158,182],[168,196]],ink,.85,.75);
 }else{
  add(arc(150,145,98,-148,32),gold,1.1);add(arc(150,145,98,48,212),gold,1.1);
  add([[111,99],[200,99],[200,180],[144,180],[144,136],[172,136],[172,155]],ink,1.5);
  add([[189,191],[100,191],[100,110],[156,110],[156,124]],ink,1.5);
  add([[126,151],[126,166],[113,166]],gold,.9);
  add([[150,37],[150,47]],ink,.9);add([[150,243],[150,253]],ink,.9);
 }
 paths.forEach((path,i)=>{const p=still||reduced.matches?1:Math.max(0,Math.min(1,(t-i*100)/1200));line(mc,path.pts,p,path.color,path.width,path.alpha)});mc.restore()}
function loading(t){bc.clearRect(0,0,bw,bh);bc.save();bc.scale(bw/570,bh/90);let p=still?.78:reduced.matches?1:Math.min(1,(t%12500)/10500);document.querySelector('#percent').textContent=String(Math.round(p*100)).padStart(2,'0')+'%';let axis=false?[[2,47],[176,47],[194,39],[363,39],[381,47],[568,47]]:false?[[2,54],[150,54],[300,49],[450,39],[568,28]]:[[2,45],[568,45]];line(bc,axis,1,ink,.65,.16);line(bc,axis,p,gold,1.2);let count=false?9:12;for(let i=0;i<count;i++){let x=35+i*(485/(count-1)),u=x/568,draw=Math.max(0,Math.min(1,(p-u+.09)/.13)),sway=still||reduced.matches?0:Math.sin(t/950-i*.42)*2;let pts;if(true){let h=10+16*Math.sin(u*Math.PI);pts=[[x,45],[x+26,45-h+sway],[x+47,45]];line(bc,pts,draw,ink,1,.85);line(bc,[[x,45],[x+24,45+h-sway],[x+47,45]],draw,ink,.85,.62)}else if(false){let y=54-26*u*u,h=14+19*Math.sin(u*Math.PI);line(bc,[[x,y],[x+17,y-h*.5+sway],[x+37,y-h]],draw,ink,1.15);line(bc,[[x+9,y],[x+26,y+11+sway],[x+45,y+16]],draw,ink,.85,.6)}else{let y=x<180||x>380?47:39;line(bc,[[x,y],[x+19,y-18+sway],[x+33,y-18+sway]],draw,ink,1);line(bc,[[x+10,y],[x+28,y+14-sway],[x+39,y+14-sway]],draw,ink,.85,.65)}}if(!still&&!reduced.matches){let q=(t%2300)/2300;line(bc,[[q*530,false?54-26*q*q:45],[q*530+18,false?53-26*q*q:45]],1,ink,1.7,Math.sin(q*Math.PI)*.7)}bc.restore()}
function render(now){let t=now-start;logo(t);loading(t);document.querySelectorAll('.compare-canvas').forEach(c=>{const [ctx,w,h]=prepare(c);logo(t,c.dataset.design,ctx,w,h)})}function loop(now){render(now);raf=requestAnimationFrame(loop)}function resume(){cancelAnimationFrame(raf);if(!document.hidden&&!still&&!reduced.matches)raf=requestAnimationFrame(loop);else render(performance.now())}
if(params.has('compare')){
 document.body.classList.add('comparing');const grid=document.createElement('div');grid.className='compare-grid';
 grid.innerHTML=['A','B','C','D'].map(d=>'<figure><canvas class="compare-canvas" data-design="'+d+'" aria-label="'+labels[d]+'"></canvas><figcaption>'+labels[d].split(' · ')[0]+'</figcaption></figure>').join('');document.querySelector('main').prepend(grid);
}
new ResizeObserver(resize).observe(document.querySelector('main'));window.addEventListener('resize',resize);document.addEventListener('visibilitychange',resume);reduced.addEventListener('change',resume);document.querySelector('#replay').onclick=()=>{if(still){location.search='?design='+choice;return}start=performance.now();resume()};window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));resize();resume();
</script></body></html>
