</style></head><body><header><span>夜鴨爭鋒 / CANVAS 選稿</span><nav aria-label="設計方向"><a href="?design=A" data-option="A">A 稜月</a><a href="?design=B" data-option="B">B 斂翼</a><a href="?design=C" data-option="C">C 裂環</a></nav></header><main><canvas class="mark" aria-label="無填色的幾何烏鴉與月亮線稿" role="img"></canvas><h1>夜鴨爭鋒</h1><div class="subtitle">NIGHT RAVENS TOURNAMENT</div><div class="meter"><canvas class="bar" aria-hidden="true"></canvas><div class="caption"><span>動態選稿 · 模擬載入</span><strong id="percent">0%</strong></div></div></main><footer><span id="description"></span><button id="replay">重播線條動畫</button></footer>
<script>
const params=new URLSearchParams(location.search),choice=['A','B','C'].includes(params.get('design'))?params.get('design'):'A';
document.querySelector(`[data-option="${choice}"]`).setAttribute('aria-current','page');
const labels={A:'A / 稜月 — 切面輪廓 × 對稱羽脈',B:'B / 斂翼 — 長折線 × 流動羽軸',C:'C / 裂環 — 斷弧結構 × 幾何羽節'};
document.querySelector('#description').textContent=labels[choice];
const styles=getComputedStyle(document.documentElement),ink=styles.getPropertyValue('--ink').trim(),gold=styles.getPropertyValue('--gold').trim();
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),still=params.has('still');
const mark=document.querySelector('.mark'),bar=document.querySelector('.bar');
let start=performance.now(),raf=0;
function prepare(canvas){const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);return [ctx,box.width,box.height]}
let mc,mw,mh,bc,bw,bh;function resize(){[mc,mw,mh]=prepare(mark);[bc,bw,bh]=prepare(bar);render(performance.now())}
function line(ctx,points,p=1,color=ink,width=1.3,alpha=1){if(p<=0)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.globalAlpha=alpha;ctx.lineJoin='miter';ctx.lineCap='butt';let total=0;for(let i=1;i<points.length;i++)total+=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);let remain=total*Math.min(p,1);ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);if(remain>=len){ctx.lineTo(...b);remain-=len}else{ctx.lineTo(a[0]+(b[0]-a[0])*remain/len,a[1]+(b[1]-a[1])*remain/len);break}}ctx.stroke();ctx.restore()}
// Hand-drafted coordinate paths: all forms are strokes; no bitmap, fill, or mask.
const head=[[74,90],[102,65],[137,56],[170,62],[194,80],[201,105],[233,146],[199,123],[188,116],[172,142]];
const eye=[[170,82],[186,91],[176,91]];
const moonA=[[131,27],[176,23],[222,42],[252,74],[269,116],[268,155],[250,198],[220,226],[192,236],[221,208],[239,177],[245,139],[241,108],[226,73],[199,49],[161,32],[131,27]];
const options={
 A:[head,[[74,90],[58,122],[45,167],[30,228],[76,192],[55,242],[105,199],[94,259],[135,211],[149,177],[158,148],[172,142]],[[74,90],[107,83],[133,91],[111,138],[76,192]],[[133,91],[141,121],[117,174],[94,218]],[[149,177],[145,218],[124,265]],[[188,116],[172,107],[152,115]],eye,[[201,105],[190,104],[233,146]]],
 B:[head,[[74,90],[54,143],[35,230],[90,159],[63,246],[121,179],[104,270],[151,195],[159,158],[172,142]],[[74,90],[116,81],[132,91],[90,159]],[[132,91],[121,134],[63,246]],[[140,121],[135,162],[104,270]],[[172,142],[153,143],[151,195]],eye,[[188,103],[199,108],[233,146]]],
 C:[[[65,103],[91,76],[131,61],[168,63],[193,82],[199,104],[233,143],[194,118],[179,123]],[[65,103],[47,158],[33,235],[94,190]],[[77,115],[110,94],[137,96],[97,154],[66,191]],[[139,110],[128,151],[92,220]],[[161,128],[149,176],[126,232]],[[179,123],[169,152],[159,200]],eye,[[197,106],[214,126]]]
};
function logo(t){mc.clearRect(0,0,mw,mh);mc.save();mc.scale(mw/300,mh/300);const reveal=still||reduced.matches?1:Math.min(1,t/1800);if(choice==='C'){line(mc,moonA.slice(0,7),reveal,gold,1.2);line(mc,[[226,222],[204,233],[180,240]],reveal,gold,1.2);line(mc,[[157,26],[186,38],[214,61]],reveal,gold,1.2)}else line(mc,moonA,reveal,gold,1.1);options[choice].forEach((pts,i)=>line(mc,pts,still||reduced.matches?1:Math.max(0,Math.min(1,(t-i*65-170)/1200)),ink,i===0?1.6:1.15));mc.restore()}
function loading(t){bc.clearRect(0,0,bw,bh);bc.save();bc.scale(bw/570,bh/90);let p=still?.78:reduced.matches?1:Math.min(1,(t%12500)/10500);document.querySelector('#percent').textContent=String(Math.round(p*100)).padStart(2,'0')+'%';let axis=choice==='C'?[[2,47],[176,47],[194,39],[363,39],[381,47],[568,47]]:choice==='B'?[[2,54],[150,54],[300,49],[450,39],[568,28]]:[[2,45],[568,45]];line(bc,axis,1,ink,.65,.16);line(bc,axis,p,gold,1.2);let count=choice==='B'?9:12;for(let i=0;i<count;i++){let x=35+i*(485/(count-1)),u=x/568,draw=Math.max(0,Math.min(1,(p-u+.09)/.13)),sway=still||reduced.matches?0:Math.sin(t/950-i*.42)*2;let pts;if(choice==='A'){let h=10+16*Math.sin(u*Math.PI);pts=[[x,45],[x+26,45-h+sway],[x+47,45]];line(bc,pts,draw,ink,1,.85);line(bc,[[x,45],[x+24,45+h-sway],[x+47,45]],draw,ink,.85,.62)}else if(choice==='B'){let y=54-26*u*u,h=14+19*Math.sin(u*Math.PI);line(bc,[[x,y],[x+17,y-h*.5+sway],[x+37,y-h]],draw,ink,1.15);line(bc,[[x+9,y],[x+26,y+11+sway],[x+45,y+16]],draw,ink,.85,.6)}else{let y=x<180||x>380?47:39;line(bc,[[x,y],[x+19,y-18+sway],[x+33,y-18+sway]],draw,ink,1);line(bc,[[x+10,y],[x+28,y+14-sway],[x+39,y+14-sway]],draw,ink,.85,.65)}}if(!still&&!reduced.matches){let q=(t%2300)/2300;line(bc,[[q*530,choice==='B'?54-26*q*q:45],[q*530+18,choice==='B'?53-26*q*q:45]],1,ink,1.7,Math.sin(q*Math.PI)*.7)}bc.restore()}
function render(now){let t=now-start;logo(t);loading(t)}function loop(now){render(now);raf=requestAnimationFrame(loop)}function resume(){cancelAnimationFrame(raf);if(!document.hidden&&!still&&!reduced.matches)raf=requestAnimationFrame(loop);else render(performance.now())}
new ResizeObserver(resize).observe(document.querySelector('main'));window.addEventListener('resize',resize);document.addEventListener('visibilitychange',resume);reduced.addEventListener('change',resume);document.querySelector('#replay').onclick=()=>{if(still){location.search='?design='+choice;return}start=performance.now();resume()};window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));resize();resume();
</script></body></html>
